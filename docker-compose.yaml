services:
  db:
    image: postgres:16
    container_name: database
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - "volume-db:/var/lib/postgresql/data"
    networks:
      - my-net
    ports:
      - "5555:5432"

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_USERNAME}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - "minio-volume:/data"

    networks:
      - my-net

volumes:
  volume-db:
  minio-volume:

networks:
  my-net:
    name: my-net
